data_inputs: ILI%
methods: Forecasts are generated using STL decomposition with an ETS model fit to the seasonally adjusted and boxcox transformed series.
methods_long: This model uses historical ILI percentage observations for each location and target. For each forecast origin date, the training data are filtered to observations available up to that date. The model applies STL decomposition to separate seasonal and non-seasonal components, using a periodic seasonal window. An ETS model is then fit to the seasonally adjusted component, and four-week-ahead probabilistic forecasts are generated from the resulting forecast distribution. 
